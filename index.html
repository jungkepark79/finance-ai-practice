<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>손익 대시보드</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f5f5f3;
    --surface-1: #fcfcfb;
    --border: #e4e3df;
    --grid: #ecebe7;
    --text-primary: #0b0b0b;
    --text-secondary: #52514e;
    --text-muted: #7a7974;
    --accent: #2a78d6;
    --series-1: #2a78d6; --series-2: #eb6834; --series-3: #1baf7a; --series-4: #eda100;
    --series-5: #e87ba4; --series-6: #008300; --series-7: #4a3aa7; --series-8: #e34948;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #111110;
      --surface-1: #1a1a19;
      --border: #2e2e2b;
      --grid: #2a2a27;
      --text-primary: #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted: #8f8e86;
      --accent: #3987e5;
      --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70; --series-4: #c98500;
      --series-5: #d55181; --series-6: #008300; --series-7: #9085e9; --series-8: #e66767;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #111110;
    --surface-1: #1a1a19;
    --border: #2e2e2b;
    --grid: #2a2a27;
    --text-primary: #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted: #8f8e86;
    --accent: #3987e5;
    --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70; --series-4: #c98500;
    --series-5: #d55181; --series-6: #008300; --series-7: #9085e9; --series-8: #e66767;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text-primary);
    font-family: "Pretendard", "Malgun Gothic", system-ui, -apple-system, sans-serif;
    font-size: 14px;
    line-height: 1.5;
  }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 32px 16px 48px; }
  header { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 24px; }
  h1 { margin: 0; font-size: 22px; font-weight: 700; }
  .sub { margin: 4px 0 0; color: var(--text-secondary); }

  .seg { display: inline-flex; flex-wrap: wrap; gap: 4px; padding: 4px; background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px; }
  .seg button {
    font: inherit; border: 0; background: transparent; color: var(--text-secondary);
    padding: 6px 14px; border-radius: 7px; cursor: pointer; font-variant-numeric: tabular-nums;
  }
  .seg button:hover { color: var(--text-primary); }
  .seg button[aria-pressed="true"] { background: var(--accent); color: #fff; font-weight: 600; }

  .kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 16px; }
  .card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; }
  .card + .card { margin-top: 16px; }
  .kpis .card + .card { margin-top: 0; }
  button.card { font: inherit; color: inherit; text-align: left; cursor: pointer; width: 100%; }
  button.card:hover { border-color: var(--text-muted); }
  button.card[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .period { color: var(--text-secondary); font-size: 13px; margin: -8px 0 12px; }

  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { padding: 9px 10px; border-bottom: 1px solid var(--grid); text-align: right; white-space: nowrap; }
  th { color: var(--text-muted); font-weight: 500; font-size: 12px; }
  th:nth-child(-n+2), td:nth-child(-n+2) { text-align: left; }
  td:nth-child(2) { white-space: normal; }
  tfoot td { font-weight: 700; border-bottom: 0; border-top: 1px solid var(--border); }
  .table-scroll { overflow-x: auto; }
  .muted { color: var(--text-muted); }
  .kpi-label { color: var(--text-secondary); font-size: 13px; }
  .kpi-value { margin-top: 6px; font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
  .kpi-value small { font-size: 14px; font-weight: 500; color: var(--text-secondary); margin-left: 2px; }
  .kpi-delta { margin-top: 6px; font-size: 13px; color: var(--text-secondary); font-variant-numeric: tabular-nums; }
  .kpi-delta b { color: var(--text-primary); font-weight: 600; }

  .chart-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
  .chart-head h2 { margin: 0; font-size: 16px; }
  .legend { display: flex; flex-wrap: wrap; gap: 14px; margin: 4px 0 8px; color: var(--text-secondary); font-size: 13px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { width: 14px; height: 3px; border-radius: 2px; display: inline-block; }
  .chart-box { position: relative; }
  svg { display: block; width: 100%; height: auto; overflow: visible; }
  .tooltip {
    position: absolute; pointer-events: none; display: none;
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 10px; font-size: 12px; box-shadow: 0 4px 16px rgba(0,0,0,.12);
    font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  .tooltip .t-title { font-weight: 600; margin-bottom: 4px; }
  .tooltip .t-row { display: flex; align-items: center; gap: 6px; color: var(--text-secondary); }
  .tooltip .t-row b { margin-left: auto; padding-left: 12px; color: var(--text-primary); font-weight: 600; }
  .tooltip i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }

  @media (max-width: 760px) {
    .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .kpi-value { font-size: 21px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>손익 대시보드</h1>
      <p class="sub">분개장 기준 · 단위 억원</p>
    </div>
    <div class="seg" id="years" role="group" aria-label="연도 선택"></div>
  </header>

  <p class="period" id="period"></p>
  <section class="kpis" id="kpis"></section>

  <section class="card">
    <div class="chart-head">
      <h2 id="chart-title">월별 추이</h2>
    </div>
    <div class="legend" id="legend"></div>
    <div class="chart-box" id="chart-box">
      <svg id="chart" role="img" aria-label="월별 추이 선 차트"></svg>
      <div class="tooltip" id="tooltip"></div>
    </div>
  </section>

  <section class="card">
    <div class="chart-head">
      <h2 id="table-title">계정과목별 상세</h2>
    </div>
    <div class="table-scroll">
      <table>
        <thead>
          <tr><th>계정코드</th><th>계정과목</th><th>금액(원)</th><th>비중</th><th>전기 대비</th></tr>
        </thead>
        <tbody id="detail-body"></tbody>
        <tfoot id="detail-foot"></tfoot>
      </table>
    </div>
  </section>
</div>

const METRICS = ["매출", "매출원가", "판관비", "영업이익"];
const YEARS = Object.keys(DATA).sort();
const EOK = 100000000;
// month: null이면 연간, 1~12면 해당 월
const state = { year: YEARS[YEARS.length - 1], metric: "매출", month: null };

const $ = (id) => document.getElementById(id);
const seriesColor = (year) => `var(--series-${(YEARS.indexOf(year) % 8) + 1})`;
const fmtEok = (v, digits = 1) => (v / EOK).toLocaleString("ko-KR", { minimumFractionDigits: digits, maximumFractionDigits: digits });
const fmtWon = (v) => v.toLocaleString("ko-KR") + "원";

function renderButtons(container, items, current, onPick, labelOf = (x) => x) {
  container.innerHTML = "";
  items.forEach((item) => {
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = labelOf(item);
    b.setAttribute("aria-pressed", String(item === current));
    b.addEventListener("click", () => onPick(item));
    container.appendChild(b);
  });
}

const monthKey = (m) => String(m).padStart(2, "0");
const prevYearOf = (y) => (DATA[String(Number(y) - 1)] ? String(Number(y) - 1) : null);

// 선택 기간(연간 또는 월)의 항목 합계
function periodTotals(year) {
  const d = DATA[year];
  return state.month ? d.monthly[monthKey(state.month)] : d.annual;
}

// 선택 기간의 계정 금액
const accountAmount = (acc) => (state.month ? acc.monthly[state.month - 1] : acc.annual);

function deltaText(cur, prev) {
  if (prev === null || prev === undefined) return `<span class="muted">신규</span>`;
  if (prev === 0) return `<span class="muted">–</span>`;
  const rate = ((cur - prev) / Math.abs(prev)) * 100;
  const arrow = rate > 0 ? "▲" : rate < 0 ? "▼" : "";
  return `${arrow} ${Math.abs(rate).toFixed(1)}%`;
}

function renderKpis() {
  const cur = periodTotals(state.year);
  const prevYear = prevYearOf(state.year);
  const prev = prevYear ? periodTotals(prevYear) : null;
  $("period").textContent = `${state.year}년 ${state.month ? state.month + "월" : "연간"} 기준`;
  $("kpis").innerHTML = METRICS.map((m) => {
    const delta = prev ? `전기 대비 <b>${deltaText(cur[m], prev[m])}</b>` : "전기 데이터 없음";
    return `<button type="button" class="card" data-metric="${m}" aria-pressed="${m === state.metric}">
      <div class="kpi-label">${m}</div>
      <div class="kpi-value" title="${fmtWon(cur[m])}">${fmtEok(cur[m])}<small>억원</small></div>
      <div class="kpi-delta">${delta}</div>
    </button>`;
  }).join("");
  $("kpis").querySelectorAll("button").forEach((b) =>
    b.addEventListener("click", () => { state.metric = b.dataset.metric; render(); }));
}

// 영업이익은 구성 항목(매출·매출원가·판관비)을, 나머지는 계정과목을 행으로 쓴다
function detailRows(year) {
  if (state.metric === "영업이익") {
    const t = periodTotals(year);
    return ["매출", "매출원가", "판관비"].map((c) => ({
      code: "", name: c === "매출" ? c : `(−) ${c}`, amount: t[c], key: c,
    }));
  }
  return DATA[year].accounts[state.metric].map((a) => ({
    code: a.code, name: a.name, amount: accountAmount(a), key: a.code,
  }));
}

function renderTable() {
  const prevYear = prevYearOf(state.year);
  const rows = detailRows(state.year).filter((r) => r.amount !== 0);
  const prevRows = prevYear ? Object.fromEntries(detailRows(prevYear).map((r) => [r.key, r.amount])) : null;
  const total = periodTotals(state.year)[state.metric];
  const prevTotal = prevYear ? periodTotals(prevYear)[state.metric] : null;
  // 영업이익의 비중은 매출 대비
  const base = state.metric === "영업이익" ? periodTotals(state.year)["매출"] : total;
  const share = (v) => (base ? `${((v / base) * 100).toFixed(1)}%` : "–");
  const delta = (cur, prev) => (prevRows ? deltaText(cur, prev) : `<span class="muted">–</span>`);

  $("table-title").textContent =
    `${state.metric} ${state.metric === "영업이익" ? "구성" : "계정과목별 상세"} · ${state.year}년 ${state.month ? state.month + "월" : "연간"}`;
  $("detail-body").innerHTML = rows.length
    ? rows.map((r) => `<tr>
        <td class="muted">${r.code}</td><td>${r.name}</td>
        <td>${r.amount.toLocaleString("ko-KR")}</td><td>${share(r.amount)}</td>
        <td>${delta(r.amount, prevRows ? prevRows[r.key] : null)}</td>
      </tr>`).join("")
    : `<tr><td colspan="5" class="muted" style="text-align:center">해당 기간 금액이 없습니다</td></tr>`;
  $("detail-foot").innerHTML = `<tr>
    <td></td><td>${state.metric} 합계</td>
    <td>${total.toLocaleString("ko-KR")}</td><td>${share(total)}</td>
    <td>${delta(total, prevTotal)}</td>
  </tr>`;
}

function niceStep(range, ticks) {
  const raw = range / ticks;
  const mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const n = raw / mag;
  return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * mag;
}

function renderChart() {
  const svg = $("chart");
  const W = 1000, H = 380;
  const m = { top: 16, right: 64, bottom: 36, left: 56 };
  const iw = W - m.left - m.right, ih = H - m.top - m.bottom;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);

  const series = YEARS.map((y) => ({
    year: y,
    values: Array.from({ length: 12 }, (_, i) => DATA[y].monthly[String(i + 1).padStart(2, "0")][state.metric]),
  }));
  const all = series.flatMap((s) => s.values);
  let lo = Math.min(0, ...all), hi = Math.max(0, ...all);
  if (lo === hi) hi = lo + EOK;
  const step = niceStep(hi - lo, 5);
  lo = Math.floor(lo / step) * step;
  hi = Math.ceil(hi / step) * step;

  const x = (i) => m.left + (iw * i) / 11;
  const y = (v) => m.top + ih - ((v - lo) / (hi - lo)) * ih;

  let out = "";
  for (let v = lo; v <= hi + step / 2; v += step) {
    const yy = y(v).toFixed(1);
    const stroke = Math.abs(v) < step / 2 ? "var(--text-muted)" : "var(--grid)";
    out += `<line x1="${m.left}" x2="${W - m.right}" y1="${yy}" y2="${yy}" stroke="${stroke}" stroke-width="1"/>`;
    out += `<text x="${m.left - 10}" y="${yy}" dy="0.32em" text-anchor="end" font-size="12" fill="var(--text-muted)">${fmtEok(v, step >= EOK ? 0 : 1)}</text>`;
  }
  const sel = state.month ? state.month - 1 : null;
  if (sel !== null) {
    const bw = iw / 11;
    out += `<rect x="${(x(sel) - bw / 2).toFixed(1)}" y="${m.top}" width="${bw.toFixed(1)}" height="${ih}" fill="var(--accent)" opacity="0.1" rx="4"/>`;
  }
  for (let i = 0; i < 12; i++) {
    const on = i === sel;
    out += `<text x="${x(i).toFixed(1)}" y="${H - m.bottom + 22}" text-anchor="middle" font-size="12" font-weight="${on ? 700 : 400}" fill="${on ? "var(--text-primary)" : "var(--text-muted)"}">${i + 1}월</text>`;
  }

  // 선택 연도를 마지막에 그려 위에 오게 한다
  const ordered = series.filter((s) => s.year !== state.year).concat(series.filter((s) => s.year === state.year));
  ordered.forEach((s) => {
    const active = s.year === state.year;
    const color = seriesColor(s.year);
    const d = s.values.map((v, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join("");
    out += `<path d="${d}" fill="none" stroke="${color}" stroke-width="${active ? 2.5 : 2}" stroke-linejoin="round" stroke-linecap="round" opacity="${active ? 1 : 0.55}"/>`;
    const last = s.values[11];
    out += `<circle cx="${x(11).toFixed(1)}" cy="${y(last).toFixed(1)}" r="4" fill="${color}" stroke="var(--surface-1)" stroke-width="2"/>`;
    out += `<text x="${x(11) + 10}" y="${y(last).toFixed(1)}" dy="0.32em" font-size="12" font-weight="${active ? 700 : 500}" fill="var(--text-secondary)">${s.year}</text>`;
    if (sel !== null) {
      out += `<circle cx="${x(sel).toFixed(1)}" cy="${y(s.values[sel]).toFixed(1)}" r="${active ? 6 : 5}" fill="${color}" stroke="var(--surface-1)" stroke-width="2"/>`;
    }
  });

  out += `<line id="crosshair" y1="${m.top}" y2="${m.top + ih}" stroke="var(--text-muted)" stroke-width="1" stroke-dasharray="3 3" visibility="hidden"/>`;
  out += `<g id="hover-dots"></g>`;
  out += `<rect id="hit" x="${m.left - iw / 22}" y="${m.top}" width="${iw + iw / 11}" height="${ih + m.bottom}" fill="transparent" style="cursor:pointer"/>`;
  svg.innerHTML = out;

  $("chart-title").textContent = `월별 ${state.metric} 추이`;
  $("legend").innerHTML = YEARS.map((yr) =>
    `<span><i style="background:${seriesColor(yr)}"></i>${yr}년</span>`).join("");

  const hit = $("hit"), cross = $("crosshair"), dots = $("hover-dots"), tip = $("tooltip"), box = $("chart-box");
  const monthAt = (e) => {
    const pt = svg.createSVGPoint();
    pt.x = e.clientX; pt.y = e.clientY;
    const p = pt.matrixTransform(svg.getScreenCTM().inverse());
    return Math.max(0, Math.min(11, Math.round(((p.x - m.left) / iw) * 11)));
  };
  hit.addEventListener("click", (e) => {
    const month = monthAt(e) + 1;
    state.month = state.month === month ? null : month;
    tip.style.display = "none";
    render();
  });
  hit.addEventListener("mousemove", (e) => {
    const i = monthAt(e);
    cross.setAttribute("x1", x(i)); cross.setAttribute("x2", x(i));
    cross.setAttribute("visibility", "visible");
    dots.innerHTML = series.map((s) =>
      `<circle cx="${x(i)}" cy="${y(s.values[i])}" r="5" fill="${seriesColor(s.year)}" stroke="var(--surface-1)" stroke-width="2"/>`).join("");
    tip.innerHTML = `<div class="t-title">${i + 1}월 ${state.metric}</div>` + series.slice().reverse().map((s) =>
      `<div class="t-row"><i style="background:${seriesColor(s.year)}"></i>${s.year}년<b>${fmtEok(s.values[i])}억원</b></div>`).join("");
    tip.style.display = "block";
    const rect = box.getBoundingClientRect();
    const px = e.clientX - rect.left, py = e.clientY - rect.top;
    const left = px + 16 + tip.offsetWidth > rect.width ? px - 16 - tip.offsetWidth : px + 16;
    tip.style.left = `${Math.max(0, left)}px`;
    tip.style.top = `${Math.max(0, py - tip.offsetHeight / 2)}px`;
  });
  hit.addEventListener("mouseleave", () => {
    cross.setAttribute("visibility", "hidden");
    dots.innerHTML = "";
    tip.style.display = "none";
  });
}

function render() {
  renderButtons($("years"), YEARS, state.year, (y) => { state.year = y; render(); }, (y) => `${y}년`);
  renderKpis();
  renderChart();
  renderTable();
}

if (YEARS.length) render();
